name: Refresh events.json

on:
  schedule:
    # Daily at 06:00 ET (10:00 UTC during EDT). Daily so a transient failure
    # gets retried within 24h, and so new DiscoverNEPA listings appear fast.
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scripts/build-events.mjs

      - name: Commit refreshed events.json
        id: commit
        run: |
          git config user.name  "northeast-almanac bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet public/events.json; then
            echo "No changes to events.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add public/events.json
          today=$(date -u +%Y-%m-%d)
          git commit -m "chore: refresh events.json ($today)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger deploy.yml's push event,
  # so publish the new data by calling that workflow directly.
  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
