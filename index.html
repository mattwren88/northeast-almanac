    <script>
      // Stamp the theme before first paint so dark readers never see a white flash.
      (function () {
        try {
          var saved = localStorage.getItem('nepa-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="theme-color" content="#fbf5e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211f1c" media="(prefers-color-scheme: dark)" />
    <!-- Fonts are self-hosted (public/fonts, @font-face in src/style.css). The
         masthead face is preloaded so the title swaps in quickly. -->
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
